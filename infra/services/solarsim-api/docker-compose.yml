services:
  api:
    build:
      context: ../../..
      dockerfile: server/Dockerfile
    container_name: solarsim-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: solarsim-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-solarsim_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set a private database password}
      DB_NAME: ${DB_NAME:-solarsim_prod}
      JWT_SECRET: ${JWT_SECRET:?Set a private random JWT secret (32+ characters)}
    networks:
      - solarsim_net

networks:
  solarsim_net:
    external: true
