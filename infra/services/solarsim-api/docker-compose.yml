services:
  api:
    build:
      context: ../../..
      dockerfile: server/Dockerfile
    container_name: solarsim-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: solarsim-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-solarsim_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set a private database password}
      DB_NAME: ${DB_NAME:-solarsim_prod}
      JWT_SECRET: ${JWT_SECRET:?Set a private random JWT secret (32+ characters)}
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-2.7.1}
      # MCP remoto (docs/MCP_REMOTE.md): apagado si MCP_REMOTE_ENABLED no es "true".
      MCP_REMOTE_ENABLED: ${MCP_REMOTE_ENABLED:-false}
      MCP_REMOTE_URL: ${MCP_REMOTE_URL:-}
      MCP_OAUTH_ENABLED: ${MCP_OAUTH_ENABLED:-false}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      # IP del cliente para límites: solo el socket salvo proxies de confianza (docs/MCP_REMOTE.md#ip-del-cliente).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
    networks:
      - solarsim_net

networks:
  solarsim_net:
    external: true
