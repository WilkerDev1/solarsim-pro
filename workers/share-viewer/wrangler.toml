name = "solarsim-share-viewer"
main = "src/index.ts"
compatibility_date = "2026-10-03"
compatibility_flags = ["nodejs_compat"]

# KV Namespace Binding para almacenar propuestas temporales
[[kv_namespaces]]
binding = "PROPOSALS_KV"
id = "e6793f84550d449899f59aa80c872067"
preview_id = "d0655740b9c04503812c4c09d39295ba"

[vars]
# Fixed trusted API; never take an authorization URL from proposal data.
AUTH_API_URL = "https://solarsim.electsun.net"

[observability]
enabled = true
head_sampling_rate = 0.1
