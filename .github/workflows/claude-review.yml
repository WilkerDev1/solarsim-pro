name: Claude review
# Revisión consultiva de PR con Claude (skill .claude/skills/revisar-pr + REVIEW.md + AGENTS.md de la rama base).
# No es un check requerido: comenta en línea y deja un resumen; nunca aprueba, bloquea ni empuja.
# Autenticación: CLAUDE_CODE_OAUTH_TOKEN (suscripción, `claude setup-token`) y, si no existe, ANTHROPIC_API_KEY.
# Guía y pasos manuales: docs/QA.md#revisión-con-claude.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [beta, main]
permissions:
  contents: read
concurrency:
  # Un push nuevo cancela la revisión del commit anterior.
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    name: claude-review
    # Sin borradores, sin forks (no reciben secretos), sin bots y sin el PR de release beta→main
    # (sus cambios ya se revisaron PR a PR).
    # Variable CLAUDE_REVIEW_ON_PUSH=false: revisar solo al abrir, reabrir o marcar listo (menos coste).
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'synchronize' || vars.CLAUDE_REVIEW_ON_PUSH != 'false') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'beta' &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # la acción canjea el OIDC por el token de la GitHub App de Claude, que publica los comentarios
    steps:
      - name: Elegir credencial
        id: auth
        shell: bash
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_OAUTH" = "true" ]; then mode=subscription
          elif [ "$HAS_API_KEY" = "true" ]; then mode=api-key
          else
            mode=none
            echo "::notice::Revisión omitida: falta el secreto CLAUDE_CODE_OAUTH_TOKEN o ANTHROPIC_API_KEY (docs/QA.md#revisión-con-claude)."
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Credencial: $mode"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.auth.outputs.mode != 'none'
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Comprobar la skill en la rama base
        id: skill
        if: steps.auth.outputs.mode != 'none'
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          # La acción restaura .claude/ desde la rama base: la skill debe existir allí, no solo en el PR.
          git fetch --no-tags --depth=1 origin "$BASE"
          if git cat-file -e "FETCH_HEAD:.claude/skills/revisar-pr/SKILL.md" 2>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Revisión omitida: $BASE aún no contiene .claude/skills/revisar-pr."
          fi

      - name: Revisar con Claude
        id: claude
        if: steps.auth.outputs.mode != 'none' && steps.skill.outputs.ready == 'true'
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          prompt: /revisar-pr ${{ github.event.pull_request.number }} --comment
          # Lista cerrada de herramientas (modo default): leer, consultar el PR y comentar; nada de editar ni ejecutar código.
          claude_args: >-
            --model ${{ vars.CLAUDE_REVIEW_MODEL || 'claude-opus-5-5' }}
            --max-turns ${{ vars.CLAUDE_REVIEW_MAX_TURNS || '40' }}
            --permission-mode default
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git show:*),Bash(git log:*),Bash(git diff:*),Bash(git fetch:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch"

      - name: Coste y turnos
        if: always() && steps.claude.outputs.execution_file != ''
        shell: bash
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          MODE: ${{ steps.auth.outputs.mode }}
        run: |
          # Con suscripción el importe es orientativo (no se factura); con clave de API es el coste a precio de lista.
          jq -r --arg mode "$MODE" '[.[] | select(.type == "result")] | last
            | "Credencial: \($mode) · turnos: \(.num_turns) · duración: \((.duration_ms // 0) / 1000 | floor) s · coste estimado: $\(.total_cost_usd)"' \
            "$EXECUTION_FILE" | tee -a "$GITHUB_STEP_SUMMARY" || true
