name: npm audit
# Informativo: no es un check requerido. Una ejecución roja avisa de vulnerabilidades altas o críticas;
# AGENTS.md prohíbe afirmar que no las hay sin un `npm audit` actual (este o uno local).
on:
  schedule:
    - cron: '17 11 * * 1' # lunes 11:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - '**/package-lock.json'
      - '.github/workflows/audit.yml'
permissions:
  contents: read
concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: audit (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dir: [., server, workers/share-viewer, mcp-remote]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: npm audit (lockfile, sin instalar)
        shell: bash
        working-directory: ${{ matrix.dir }}
        run: |
          set +e
          npm audit --package-lock-only --audit-level=high > "$RUNNER_TEMP/audit.txt" 2>&1
          status=$?
          {
            echo "### npm audit — \`${{ matrix.dir }}\` ($(date -u +%F))"
            echo '```'
            tail -n 60 "$RUNNER_TEMP/audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/audit.txt"
          exit $status
