name: Build official desktop release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing official tag to compile, e.g. v2.3.1'
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  contracts:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}
  desktop:
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            metadata: latest-linux.yml
          - os: windows-latest
            platform: win
            arch: x64
            metadata: latest.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate tag and package version
        shell: bash
        run: node -e 'if(!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG !== "v"+require("./package.json").version) process.exit(1)'
      - if: runner.os == 'Linux'
        name: Install Linux packaging tools with bounded official mirrors
        timeout-minutes: 5
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          sources = [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.list'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt').glob('*mirrors*.txt')]
          for source in sources:
              if source.is_file():
                  text = source.read_text()
                  updated = text.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != text:
                      source.write_text(updated)
          PY
          sudo timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo timeout 120s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libarchive-tools
      - run: npm ci
      - run: npm run build
      - run: npm run build:electron
      - name: Package on native runner
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./release/SolarSim-Pro-$(node -p "require('./package.json').version").deb
          test -s "/opt/SolarSim Pro/resources/electsun-emblem-transparent.png"
          xvfb-run -a node scripts/qa/installedStart.mjs "/opt/SolarSim Pro/solarsim-pro"
          xvfb-run -a node scripts/qa/runElectronRuntime.mjs "/opt/SolarSim Pro/resources/app.asar"
      - name: AppImage startup without requiring FUSE on the runner
        if: runner.os == 'Linux'
        run: |
          candidate="$PWD/release/SolarSim-Pro-$(node -p "require('./package.json').version").AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a node scripts/qa/installedStart.mjs "$candidate"
      - name: Pacman installation and startup on isolated Arch Linux
        if: runner.os == 'Linux'
        run: |
          docker run --rm -e GITHUB_ACTIONS=true -v "$PWD/release:/packages:ro" -v "$PWD/scripts/qa:/qa:ro" archlinux:base bash -euc '
            pacman -Syu --noconfirm nodejs xorg-server-xvfb xorg-xauth
            pacman -U --noconfirm /packages/SolarSim-Pro-*.pacman
            xvfb-run -a node /qa/installedStart.mjs "/opt/SolarSim Pro/solarsim-pro"
          '
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/qa/installWindows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/SolarSim-Pro-*.exe
            release/SolarSim-Pro-*.exe.blockmap
            release/SolarSim-Pro-*.AppImage
            release/SolarSim-Pro-*.deb
            release/SolarSim-Pro-*.pacman
            release/SolarSim-Pro-*.tar.gz
            release/${{ matrix.metadata }}
  draft:
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - run: npm run release:manifests
      - run: npx tsx scripts/qa/verifyReleaseFiles.ts
      - name: Create draft awaiting local GPG verification and signing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "SolarSim Pro $RELEASE_TAG" --notes-file "release/release-notes-$RELEASE_TAG.md"
          gh release upload "$RELEASE_TAG" release/SolarSim-Pro-* release/solarsim-pro_*.deb release/latest.json release/update.json release/latest.yml release/latest-linux.yml
