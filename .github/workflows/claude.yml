name: Claude (@claude)
# Claude bajo demanda: responde a menciones `@claude` en issues, PR y revisiones.
# Solo propietario, miembros y colaboradores; la acción vuelve a exigir acceso de escritura y rechaza bots.
# Nunca corre sobre PR de forks: el trabajo tiene permisos de escritura y el secreto, y el código sería ajeno.
# Puede empujar commits a la rama del PR o a una rama nueva (nunca abre ni fusiona PR por sí solo).
# Riesgo residual (issues de terceros): docs/QA.md#revisión-con-claude.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
jobs:
  claude:
    # Las revisiones traen el repositorio de cabecera; para issue_comment sobre un PR lo comprueba un paso.
    if: >-
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # En el trabajo (no en el workflow): los comentarios sin @claude no entran en la cola.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # leer el resultado de CI del PR
    steps:
      - name: Rechazar PR de forks
        id: origin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IS_PR_COMMENT: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request != null }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "$IS_PR_COMMENT" != "true" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          head=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.repo.full_name // ""')
          if [ "$head" = "$REPO" ]; then
            echo "same=true" >> "$GITHUB_OUTPUT"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
            echo "::notice::@claude omitido: el PR viene de un fork (${head:-repositorio borrado})."
          fi

      - name: Elegir credencial
        id: auth
        if: steps.origin.outputs.same == 'true'
        shell: bash
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_OAUTH" = "true" ] || [ "$HAS_API_KEY" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Falta el secreto CLAUDE_CODE_OAUTH_TOKEN o ANTHROPIC_API_KEY (docs/QA.md#revisión-con-claude)."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.auth.outputs.ready == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        if: steps.auth.outputs.ready == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          # Solo los comentarios del propietario llegan a Claude como contexto (menos texto de terceros).
          include_comments_by_actor: ${{ github.repository_owner }}
          claude_args: >-
            --model ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
            --max-turns ${{ vars.CLAUDE_MAX_TURNS || '40' }}
