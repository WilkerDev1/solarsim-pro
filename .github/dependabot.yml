# Actualizaciones automáticas contra `beta`. Las acciones están fijadas por SHA con la versión en comentario;
# Dependabot actualiza ambos. Las mayores de npm llegan en PR propios porque suelen exigir cambios de código.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: beta
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    groups:
      acciones:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    target-branch: beta
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      cliente-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /server
    target-branch: beta
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      api-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /workers/share-viewer
    target-branch: beta
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    groups:
      visor-menores:
        update-types: [minor, patch]
